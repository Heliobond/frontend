name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.4

      - name: Install dependencies
        run: bun install

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      # `next build` runs the TypeScript type-checker and fails on any type error,
      # so this is the load-bearing correctness gate. The explicit typecheck step
      # below makes the failure mode obvious in the logs.
      - name: Build
        run: bun run build

      - name: Check bundle size
        run: bun run bundle:check

      - name: Type-check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.4

      - name: Install dependencies
        run: bun install

      - name: Run unit tests
        run: bun run test -- --coverage

      - name: Run referral-specific tests
        run: bun run test -- --reporter=verbose src/lib/referral src/components/Referral

  referral-e2e:
    name: referral-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.4

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build app
        run: bun run build

      - name: Run referral E2E tests
        run: bunx playwright test referral/
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet

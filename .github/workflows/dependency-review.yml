name: Dependency review

# Compares the dependency graph of a PR against its base and fails when the PR
# adds a dependency with a high-severity or malware advisory. Requires the
# dependency graph to be enabled for the repository (Settings > Code security).

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development
